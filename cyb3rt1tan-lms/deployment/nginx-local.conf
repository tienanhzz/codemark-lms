# Rendered by verify-realtime-gateway.py into a private, temporary runtime prefix.
worker_processes 1;
pid nginx.pid;
error_log error.log warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    upstream lms_api {
        # Engine.IO long-poll requests must return to the process owning the SID.
        ip_hash;
        server 127.0.0.1:@@API_A@@;
        server 127.0.0.1:@@API_B@@;
    }
    server {
        listen 127.0.0.1:@@GATEWAY@@;
        client_max_body_size 25m;
        location /socket.io/ {
            proxy_pass http://lms_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
        }
        location /v1/ {
            proxy_pass http://lms_api;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
        }
        location = /health/ready {
            proxy_pass http://lms_api;
            proxy_set_header Host $http_host;
        }
        location / {
            proxy_pass http://127.0.0.1:3100;
            proxy_set_header Host $http_host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
        }
    }
}
