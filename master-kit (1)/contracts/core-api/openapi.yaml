        type: string
        minLength: 32
        maxLength: 128
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ClanId:
      name: clanId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    CsvChecksum:
      name: X-File-SHA256
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{64}$
    CsvPreviewToken:
      name: X-Preview-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 40
        maxLength: 128
    CsvDuplicatePolicy:
      name: X-Duplicate-Policy
      in: header
      required: true
      schema:
        type: string
        enum:
        - upsert
        - skip
    CsvCommitConfirmation:
      name: X-Confirm
      in: header
      required: true
      schema:
        type: string
        const: 'true'
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
  responses:
    AuthenticationFailed:
      description: Credentials are invalid or the account cannot sign in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    OriginRejected:
      description: Request Origin does not match the application origin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    CsrfRejected:
      description: CSRF token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    LoginRateLimited:
      description: Login rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    RuntimeUnauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    RuntimeBadRequest:
      description: Password change rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    RuntimeConflict:
      description: Password credential is not configured.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeError'
    Success:
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Accepted:
      description: Request accepted for asynchronous processing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Caller is authenticated but not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or not visible to caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State, idempotency, or optimistic concurrency conflict.
