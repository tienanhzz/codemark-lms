openapi: 3.1.0
info:
  title: Master Kit LMS Core API
  version: 1.0.0
  description: Contract-first REST API for the LMS. Runtime implementation is incremental. Authorization
    is default-deny, all mutations are audited, and published content/delivery versions are immutable.
servers:
- url: /v1
security:
- cookieAuth: []
tags:
- name: Access
- name: Courses
- name: Branding
- name: Questions
- name: Assessments
- name: Accounts
- name: Attendance
- name: Exam Monitoring
- name: Economy
- name: Clans
- name: Achievements
- name: Reports
- name: Notifications
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Access
      summary: Create a browser session with local credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user and session cookies.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie and readable CSRF cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '202':
          description: Password accepted; complete pre-login MFA enrollment for a required role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupChallengeResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
  /auth/accept-invitation:
    post:
      operationId: acceptAccountInvitation
      tags:
      - Accounts
      summary: Accept a single-use invitation and create an active account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: Account created; a session is omitted when its role requires MFA enrollment.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LoginResponse'
                - $ref: '#/components/schemas/InvitationRequiresMfaResponse'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/OriginRejected'
        '409':
          $ref: '#/components/responses/RuntimeConflict'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
  /auth/mfa/enrollment:
    post:
      operationId: startRequiredMfaEnrollment
      tags:
      - Access
      summary: Start MFA enrollment using a short-lived password-verified challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupTokenRequest'
      responses:
        '200':
          description: TOTP secret and provisioning URI; response must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResponse'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
  /auth/mfa/enrollment/confirm:
    post:
      operationId: confirmRequiredMfaEnrollment
      tags:
      - Access
      summary: Confirm required MFA enrollment and establish a verified session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaSetupConfirmationRequest'
      responses:
        '200':
          description: MFA enabled, one-time recovery codes returned, and session established.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie and readable CSRF cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequiredMfaEnrollmentResponse'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '429':
          $ref: '#/components/responses/LoginRateLimited'
  /me:
    get:
      operationId: getCurrentUser
      tags:
      - Access
      summary: Read the current user profile and global roles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Access
      summary: Revoke the current browser session
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and authentication cookies cleared.
          headers:
            Set-Cookie:
              description: Expired session and CSRF cookies.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /me/password:
    post:
      operationId: changeCurrentPassword
      tags:
      - Access
      summary: Change the current user's password and revoke all sessions
      security:
      - cookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed, all sessions revoked, cookies cleared.
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /me/security/mfa:
    get:
      operationId: getCurrentMfaStatus
      tags:
      - Access
      summary: Read the current user's MFA enrollment status
      responses:
        '200':
          description: MFA status without revealing authenticator secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaStatusResponse'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
  /me/security/mfa/enrollment:
    post:
      operationId: startCurrentMfaEnrollment
      tags:
      - Access
      summary: Start optional MFA enrollment after password reauthentication
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaEnrollmentStartRequest'
      responses:
        '200':
          description: TOTP secret and provisioning URI; response must not be cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentResponse'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/security/mfa/enrollment/confirm:
    post:
      operationId: confirmCurrentMfaEnrollment
      tags:
      - Access
      summary: Confirm optional MFA enrollment and return one-time recovery codes
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: MFA enabled, all sessions revoked, and recovery codes returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollmentCompleteResponse'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /me/security/mfa/disable:
    post:
      operationId: disableCurrentMfa
      tags:
      - Access
      summary: Disable optional MFA with password and TOTP reauthentication
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
      responses:
        '204':
          description: MFA disabled and all sessions revoked.
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/RuntimeConflict'
  /access/policy:
    get:
      operationId: getAccessPolicy
      tags:
      - Access
      summary: Read the active access policy
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '202':
          description: MFA cleared and all user sessions revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaResetResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /access/policies:
    post:
      operationId: createAccessPolicy
      tags:
      - Access
      summary: Create a draft policy version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPolicyDraft'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses:
    get:
      operationId: listCourses
      tags:
      - Courses
      summary: List courses visible to the caller
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - active
          - completed
          - archived
      - name: termId
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCourse
      tags:
      - Courses
      summary: Create a draft course
      description: Requires an authorized Teacher or Admin; owner and scope are derived/validated server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: getCourse
      tags:
      - Courses
      summary: Read course details allowed to the caller
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCourse
      tags:
      - Courses
      summary: Update an editable course draft or metadata
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePatch'
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/faculties:
    get:
      operationId: listFaculties
      tags:
      - Courses
      summary: List active faculty catalog entries
      description: Admin-only. Set includeRetired to include historical catalog entries.
      parameters:
      - name: includeRetired
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createFaculty
      tags:
      - Courses
      summary: Create an Admin-managed faculty catalog entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/faculties/{facultyId}:
    parameters:
    - name: facultyId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    patch:
      operationId: updateFaculty
      tags:
      - Courses
      summary: Update or retire a faculty catalog entry
      description: Catalog IDs are immutable; retiring an entry preserves existing course references.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacultyPatch'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/academic-terms:
    get:
      operationId: listAcademicTerms
      tags:
      - Courses
      summary: List active academic-term catalog entries
      description: Admin-only. Set includeRetired to include historical catalog entries.
      parameters:
      - name: includeRetired
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAcademicTerm
      tags:
      - Courses
      summary: Create an Admin-managed academic term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/academic-terms/{termCode}:
    parameters:
    - name: termCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    patch:
      operationId: updateAcademicTerm
      tags:
      - Courses
      summary: Update or retire an academic term
      description: Term codes are immutable; retirement preserves existing course references.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermPatch'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/course-rule-templates:
    get:
      operationId: getActiveCourseRuleTemplate
      tags:
      - Courses
      summary: Read the active shared course-rules template
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createCourseRuleTemplate
      tags:
      - Courses
      summary: Create a draft version of the shared course-rules template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRuleTemplateDraft'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/course-rule-templates/{templateId}/activate:
    parameters:
    - name: templateId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    post:
      operationId: activateCourseRuleTemplate
      tags:
      - Courses
      summary: Validate and activate a shared course-rules template version
      description: Admin-only. The active defaults apply across all courses while stable-ID course-specific
        overrides remain in force. Reject activation that would orphan existing overrides unless the draft
        explicitly resolves them.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/rules:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: getEffectiveCourseRules
      tags:
      - Courses
      summary: Read the published effective rules for a course
      description: Available only to enrolled students and authorized course staff.
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveCourseRules'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCourseRuleOverrides
      tags:
      - Courses
      summary: Replace course-specific rule overrides and additional rules
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRuleOverridesDraft'
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveCourseRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /branding:
    get:
      operationId: getPublicBranding
      tags:
      - Branding
      summary: Read public platform branding metadata and active logo URL
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin/branding:
    get:
      operationId: getAdminBranding
      tags:
      - Branding
      summary: Read active logo metadata and prior version history
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/branding/logo:
    put:
      operationId: replacePlatformLogo
      tags:
      - Branding
      summary: Upload and activate a normalized square PNG platform logo
      description: Admin-only. Accepts at most 5 MiB of PNG bytes at exactly 1024 by 1024 pixels. The
        web cropper accepts PNG/JPEG/WebP locally and submits its 1:1 PNG crop. The server must decode,
        strip metadata, re-encode, version, and audit the image; reject malformed, animated, SVG, oversized,
        or MIME-mismatched input.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /courses/{courseId}/archive:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      operationId: archiveCourse
      tags:
      - Courses
      summary: Archive a course without deleting history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/activate:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      operationId: activateCourse
      tags:
      - Courses
      summary: Activate an editable draft course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/complete:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      operationId: completeCourse
      tags:
      - Courses
      summary: Complete an active course while retaining its records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/courses/{courseId}/restore:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    post:
      operationId: restoreCourse
      tags:
      - Courses
      summary: Restore an archived course with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/staff:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseStaff
      tags:
      - Courses
      summary: List course staff and effective permission summaries
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addCourseStaff
      tags:
      - Courses
      summary: Add a co-instructor or TA
      description: Set ownerTransfer=true with a required reason to transfer ownership to an active Teacher.
        The new owner must be an existing active co-instructor or is added to staff atomically. The previous
        owner is not implicitly retained as staff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseStaffGrant'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /courses/{courseId}/staff/{userId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: removeCourseStaff
      tags:
      - Courses
      summary: End a staff membership and revoke its course permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/permission-grants:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCoursePermissionGrants
      tags:
      - Access
      summary: List scoped course permission grants
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: grantCoursePermission
      tags:
      - Access
      summary: Grant an allowlisted permission to active course staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionGrantRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/permission-grants/{grantId}:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - name: grantId
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: revokeCoursePermission
      tags:
      - Access
      summary: Revoke a course permission with an audit reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '204':
          description: Permission grant revoked.
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/enrollments:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseEnrollments
      tags:
      - Courses
      summary: List course enrollments under roster permission
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - invited
          - active
          - withdrawn
          - completed
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: enrollCourseStudent
      tags:
      - Courses
      summary: Enroll or invite a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /courses/{courseId}/grade-schemes:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listGradeSchemes
      tags:
      - Courses
      summary: List immutable grade scheme versions for a course
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseGradeSchemeList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createGradeScheme
      tags:
      - Courses
      summary: Create a course grade scheme draft
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeSchemeDraft'
      responses:
        '201':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSchemeView'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /courses/{courseId}/grade-schemes/{schemeVersionId}/publish:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    - name: schemeVersionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: publishGradeScheme
      tags:
      - Courses
      summary: Publish an immutable grade scheme version
      description: Requires active assessment weights to total exactly 100 percent.
      responses:
        '202':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeSchemeView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /courses/{courseId}/lesson-plan:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: getCourseLessonPlan
      tags:
      - Courses
      summary: Read the course lesson plan
      description: Available to course staff and actively enrolled students.
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanView'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceCourseLessonPlanDraft
      tags:
      - Courses
      summary: Save a lesson plan draft
      description: Course owner/Admin or staff with course.content.author permission. This replaces only
        the editable course plan draft. Entry IDs are returned by the API and may be resubmitted to retain
        scheduled-session links; entries linked to sessions cannot be removed. Lesson-version IDs remain
        opaque until lesson authoring is implemented.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonPlanDraft'
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonPlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/resources:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listCourseResources
      tags:
      - Courses
      summary: List course learning resources, useful links and required software
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResourcesView'
    put:
      operationId: replaceCourseResources
      tags:
      - Courses
      summary: Replace the bounded course resource list
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseResourcesDraft'
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseResourcesView'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /courses/{courseId}/sessions:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: listTeachingSessions
      tags:
      - Courses
      summary: List scheduled teaching sessions
      description: Available to course staff and actively enrolled students; timestamps are returned in
        UTC.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeachingSessionView'
                required:
                - items
                additionalProperties: false
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createTeachingSession
      tags:
      - Courses
      summary: Create a scheduled teaching session
      description: Course owner/Admin or staff with course.content.author permission. Input timestamps
        must include offsets consistent with the supplied IANA timezone; online URLs must use HTTPS. A
        lessonPlanEntryId must reference a current course plan entry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingSession'
      responses:
        '201':
          description: Implemented BUILD-03 response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeachingSessionView'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /taxonomy:
    get:
      operationId: getLearningTaxonomy
      tags:
      - Questions
      summary: Read the active lesson categories and tags
      description: Authenticated users read active learning-content nodes and merge redirects; Admin may
        include retired nodes.
      parameters:
      - name: includeRetired
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /question-taxonomy:
    get:
      operationId: getQuestionTaxonomy
      tags:
      - Questions
      summary: Read active question categories and tags
      description: 'Categories and tags come from tables dedicated to questions. Admin may include retired
        nodes and receives distinct question usage counts; other roles do not receive counts.

        '
      parameters:
      - name: includeRetired
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/question-taxonomy/categories:
    post:
      operationId: createQuestionCategory
      tags:
      - Questions
      summary: Create an Admin-managed question category
      description: Admin-only and same-origin. IDs are stable slugs; an optional parent must be an active
        category. Creation is audited and advances the shared taxonomy catalog version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /admin/question-taxonomy/categories/{categoryId}:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    patch:
      operationId: updateQuestionCategory
      tags:
      - Questions
      summary: Update an Admin-managed question category
      description: Admin-only and same-origin. IDs are immutable. Reparenting validates the category tree;
        retiring a category with active children is rejected. Changes are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodePatch'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /admin/question-taxonomy/tags:
    post:
      operationId: createQuestionTag
      tags:
      - Questions
      summary: Create an Admin-managed question tag
      description: Admin-only and same-origin. IDs are stable slugs; an optional parent must be an active
        tag. Selectability and changes are audited; creation advances the catalog version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionTagCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /admin/question-taxonomy/tags/{tagId}:
    parameters:
    - name: tagId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    patch:
      operationId: updateQuestionTag
      tags:
      - Questions
      summary: Update an Admin-managed question tag
      description: Admin-only and same-origin. IDs are immutable. Reparenting validates the tag tree;
        retiring a tag with active children is rejected. Changes are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionTagPatch'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /admin/taxonomy/seed:
    post:
      operationId: importInitialLearningTaxonomy
      tags:
      - Questions
      summary: Import the initial category and tag catalog once
      description: Admin-only bootstrap operation. Requires the current catalogVersion and an empty version-1
        catalog; inserts both trees,         lesson taxonomy, applicability, audit and revision atomically.
        Question taxonomy is stored separately. Nodes must have unique IDs, refer only to parents in their
        own tree, and be acyclic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomySeedImport'
      responses:
        '201':
          description: Initial catalog imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomySeedImportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /admin/taxonomy/categories:
    post:
      operationId: createContentCategory
      tags:
      - Questions
      summary: Create an Admin-managed category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodeCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/taxonomy/categories/{categoryId}:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    patch:
      operationId: updateContentCategory
      tags:
      - Questions
      summary: Rename, re-parent, reorder, activate, or retire a category
      description: Category IDs are immutable; hierarchy cycles and retiring a parent with active children
        are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodePatch'
      responses:
        '200':
