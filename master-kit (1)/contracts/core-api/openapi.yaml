        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAssessment
      tags:
      - Assessments
      summary: Create a draft exam or assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentDraftRequest'
      responses:
        '201':
