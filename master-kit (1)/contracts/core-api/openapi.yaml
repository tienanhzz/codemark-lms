  /admin/shop/items:
    get:
      operationId: listAdminShopItems
      tags: [Economy]
      summary: List catalog items and current discount schedules
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      operationId: createShopItem
      tags: [Economy]
      summary: Publish a catalog item with a server-validated supported effect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemKey, name, priceCoin, stock, effectType]
              properties:
                itemKey: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
                name: {type: string, minLength: 1, maxLength: 120}
                description: {type: string, maxLength: 500}
                priceCoin: {type: integer, minimum: 0, maximum: 2000000000}
                priceExp: {type: integer, minimum: 0, maximum: 2000000000, default: 0}
                stock: {type: integer, minimum: 0, maximum: 1000000}
                purchaseLimit: {type: integer, minimum: 1, maximum: 100, default: 1}
                eligibleRoles: {type: array, maxItems: 6, items: {type: string}}
                effectType: {type: string, enum: [cosmetic, title-token, create-clan, rename-clan, practice-boost, exp-voucher, exp-multiplier, streak-boost]}
                effectConfig:
                  type: object
                  description: 'For title-token, {title: non-empty text up to 80}; for exp-voucher, exactly {exp: positive integer}; for exp-multiplier, exactly {multiplier: 2, durationHours: 1..168}; for streak-boost, exactly {missionId: active supported mission, durationHours: 1..168}. These effects are bound. Purchased title may be priced in Coin, EXP, or both.'
                  oneOf:
                  - type: object
                    required: [title]
                    properties:
                      title: {type: string, minLength: 1, maxLength: 80}
                    additionalProperties: false
                  - type: object
                    required: [exp]
                    properties:
                      exp: {type: integer, minimum: 1, maximum: 2000000000}
                    additionalProperties: false
                  - type: object
                    required: [multiplier, durationHours]
                    properties:
                      multiplier: {type: integer, enum: [2]}
                      durationHours: {type: integer, minimum: 1, maximum: 168}
                    additionalProperties: false
                  - type: object
                    required: [missionId, durationHours]
                    properties:
                      missionId: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$'}
                      durationHours: {type: integer, minimum: 1, maximum: 168}
                    additionalProperties: false
                tradeable: {type: boolean, default: false}
                discountPercent: {type: integer, minimum: 0, maximum: 100, default: 0}
                discountStartsAt: {type: string, format: date-time}
                discountEndsAt: {type: string, format: date-time}
              description: A nonzero discount requires both timezone-aware endpoints, with end after start.
              additionalProperties: false
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailure'
