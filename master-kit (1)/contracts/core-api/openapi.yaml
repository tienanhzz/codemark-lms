      summary: Create an Admin-managed tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/taxonomy/tags/{tagId}:
    parameters:
    - name: tagId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    patch:
      operationId: updateContentTag
      tags:
      - Questions
      summary: Rename, re-parent, reorder, change applicability, or retire a tag
      description: Tag hierarchy is navigational only; it does not imply inherited filtering.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
