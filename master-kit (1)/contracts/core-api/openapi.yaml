        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/taxonomy/categories/{categoryId}/merge:
    parameters:
    - name: categoryId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    post:
      operationId: mergeContentCategory
      tags:
      - Questions
      summary: Retire a category and record its redirect to another active category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyMergeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
