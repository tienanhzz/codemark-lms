      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsvImportRequest'
      responses:
        '201':
          description: A bounded, expiring import job with a raw CSV preview endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportCreated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '400':
          description: Unsupported template version
      description: 'Actor-owned, digest/checksum-bound CSV workflow; raw identity values are not staged.
        User imports require Admin: v1 has username,email,official_name,institutional_id,role; v2 adds
        faculty_id,course_id,section_id. Enrollment v1 requires Admin or Administrative Assistant and
        has institutional_id,username,course_id,section_id,status. Live permissions and relevant user/course/membership
        revisions are rechecked. At most 1 MB and 500 rows; validate all rows before atomic commit.'
