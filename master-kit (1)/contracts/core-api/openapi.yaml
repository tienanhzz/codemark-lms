    parameters:
    - $ref: '#/components/parameters/AssessmentId'
    - name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resetStudentExamAttempt
      tags:
      - Exam Monitoring
      summary: Reset one student's in-progress exam attempt
      description: Admin or a Teacher assigned to the assessment's course may clear a recipient's work
        in an in-progress attempt only while the assessment is open. A required reason is audited. The
        same attempt remains in progress with its original deadline/countdown, attempt count, and published
        question snapshot; no replacement attempt is created. Preserve pre-reset answers for audit and
        advance the answer revision atomically so stale clients cannot restore them. TAs cannot use this
        operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamAttemptResetRequest'
      responses:
        '201':
          description: Current answers cleared; attempt and original timer continue unchanged.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - requestId
                properties:
                  data:
                    $ref: '#/components/schemas/ExamAttemptResetResult'
                  requestId:
                    type: string
                additionalProperties: false
        '401':
          $ref: '#/components/responses/RuntimeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
