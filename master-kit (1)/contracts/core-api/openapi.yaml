      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/CsvChecksum'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Row outcomes and a short-lived token bound to the exact CSV checksum.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportPreview'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '413':
          description: CSV exceeds the 1 MB or 500-row limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeError'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      description: 'Actor-owned, digest/checksum-bound CSV workflow; raw identity values are not staged.
        User imports require Admin: v1 has username,email,official_name,institutional_id,role; v2 adds
        faculty_id,course_id,section_id. Enrollment v1 requires Admin or Administrative Assistant and
        has institutional_id,username,course_id,section_id,status. Live permissions and relevant user/course/membership
        revisions are rechecked. At most 1 MB and 500 rows; validate all rows before atomic commit.'
  /admin/csv-imports/{jobId}/commit:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      operationId: commitCsvImport
      tags:
      - Accounts
      summary: Atomically commit a validated CSV preview and deliver invitations
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/CsvChecksum'
      - $ref: '#/components/parameters/CsvPreviewToken'
      - $ref: '#/components/parameters/CsvDuplicatePolicy'
      - $ref: '#/components/parameters/CsvCommitConfirmation'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Account changes and audit event committed; delivery counts report post-commit email
            outcomes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportCommit'
        '400':
          $ref: '#/components/responses/RuntimeBadRequest'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '413':
          description: CSV exceeds the 1 MB or 500-row limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeError'
        '422':
          $ref: '#/components/responses/ValidationFailure'
        '409':
          $ref: '#/components/responses/Conflict'
      description: 'Actor-owned, digest/checksum-bound CSV workflow; raw identity values are not staged.
        User imports require Admin: v1 has username,email,official_name,institutional_id,role; v2 adds
        faculty_id,course_id,section_id. Enrollment v1 requires Admin or Administrative Assistant and
