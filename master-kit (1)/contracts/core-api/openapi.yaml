        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/taxonomy/tags/{tagId}/merge:
    parameters:
    - name: tagId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9-]{0,127}$
    post:
      operationId: mergeContentTag
      tags:
      - Questions
      summary: Retire a tag and record its redirect to another active tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyMergeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /courses/{courseId}/questions:
    parameters:
    - $ref: '#/components/parameters/CourseId'
    get:
      operationId: searchCourseQuestions
      tags:
      - Questions
      summary: Search authorized course question bank
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PageSize'
      - name: categoryId
        in: query
        schema:
          type: string
      - name: tagIds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      - name: tagMatch
        in: query
        schema:
          type: string
          enum:
          - any
          - all
      - name: questionType
        in: query
        schema:
          $ref: '#/components/schemas/QuestionType'
      - name: difficulty
        in: query
        schema:
          type: string
          enum:
          - newbie
          - noob
          - wannabe
          - gatekeeper
          - legendary
          description: 'Five ordered levels: Newbie (1), Noob (2), Wannabe (3), Gatekeeper (4), Legendary
            (5).'
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createQuestion
      tags:
      - Questions
      summary: Create a draft question and initial version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationFailure'
  /questions/{questionId}/versions:
    parameters:
    - name: questionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: createQuestionVersion
      tags:
      - Questions
      summary: Create a new draft question version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Conflict'
  /questions/{questionId}/versions/{versionId}:
    parameters:
    - name: questionId
      in: path
      required: true
      schema:
        type: string
    - name: versionId
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getQuestionVersion
      tags:
      - Questions
      summary: Read a question version using an authorized projection
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
  /questions/{questionId}/versions/{versionId}/validate:
    parameters:
    - name: questionId
      in: path
      required: true
      schema:
        type: string
    - name: versionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: validateQuestionVersion
      tags:
      - Questions
      summary: Validate a draft version without publishing it
      description: Returns `valid` and schema/relationship errors with HTTP 200; validation does not publish.
        Code author tests and protected listening assets are not executed or verified by this operation.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /questions/{questionId}/versions/{versionId}/publish:
    parameters:
    - name: questionId
      in: path
      required: true
      schema:
        type: string
    - name: versionId
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: publishQuestionVersion
      tags:
      - Questions
      summary: Publish a validated question version
      description: Publishes a valid non-Code, non-Listening question version immediately and immutably.
        Code publication is blocked until isolated runner validation is available; Listening publication
        is blocked until protected asset validation/storage is available.
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailure'
