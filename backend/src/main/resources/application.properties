server.port=${PORT:5000}
server.address=0.0.0.0
server.servlet.session.timeout=120s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./instance/classflow;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
server.error.include-message=never
codemark.origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
codemark.lan-origins=${DEV_LAN_ORIGINS:}
codemark.upload-dir=${UPLOAD_DIR:./instance/uploads}
codemark.token-key=${TOKEN_ENCRYPTION_KEY:}
codemark.runner-enabled=${CODE_RUNNER_ENABLED:false}
codemark.runner-image=${CODE_RUNNER_IMAGE:codemark-classflow-runner:latest}
codemark.runner-concurrency=${CODE_RUNNER_MAX_CONCURRENCY:2}
