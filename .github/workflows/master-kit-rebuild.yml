name: Master kit rebuild
on:
  push:
    paths: ['cyb3rt1tan-lms/**', 'master-kit (1)/**', 'docs/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/**']
  pull_request:
    paths: ['cyb3rt1tan-lms/**', 'master-kit (1)/**', 'docs/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql+psycopg://codemark:codemark-ci-only@127.0.0.1:5432/codemark_lms
      TEST_DATABASE_URL: postgresql+psycopg://codemark:codemark-ci-only@127.0.0.1:5432/codemark_lms_test
      LOGIN_HMAC_KEY: ci-test-only-key-of-at-least-32-characters
      MFA_ENCRYPTION_KEY: dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codemark
          POSTGRES_PASSWORD: codemark-ci-only
          POSTGRES_DB: codemark_lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - name: Install hash-pinned API dependencies
        run: python -m pip install --require-hashes -r cyb3rt1tan-lms/api/requirements.lock
      - name: Contract validation
        run: python 'master-kit (1)/scripts/validate_contracts.py'
      - name: Original BUILD source baseline
        run: python cyb3rt1tan-lms/scripts/verify-master-kit.py
      - name: API verification
        working-directory: cyb3rt1tan-lms/api
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m ruff check app migrations tests scripts
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
              BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
            else
              BASE_SHA="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            fi
          fi
          mapfile -t changed_python < <(git -C ../.. diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- cyb3rt1tan-lms/api/app cyb3rt1tan-lms/api/migrations cyb3rt1tan-lms/api/tests cyb3rt1tan-lms/api/scripts | sed 's#^cyb3rt1tan-lms/api/##' | grep -E '\.py$' || true)
          if ((${#changed_python[@]})); then
            python -m ruff format --check "${changed_python[@]}"
          else
            echo "No changed API Python files to format-check."
          fi
          python -m mypy app scripts
          python -m pytest -q
      - name: Install web dependencies
        working-directory: cyb3rt1tan-lms/web
        run: npm ci --ignore-scripts
      - name: PostgreSQL identity integration
        working-directory: cyb3rt1tan-lms
        run: |
          python scripts/verify-postgres.py
          python scripts/verify-identity-postgres.py
          python scripts/verify-courses-postgres.py
          python scripts/verify-persistence-postgres.py
          python scripts/verify-self-service-postgres.py
          python scripts/verify-provisioning-postgres.py
          python scripts/verify-profile-media-postgres.py
      - name: Generate contract DTOs
        run: python cyb3rt1tan-lms/scripts/generate-types.py
      - name: Dependency inventory and local source assets
        working-directory: cyb3rt1tan-lms
        run: python scripts/foundation-evidence.py
      - name: Build-only dependency auditor
        working-directory: cyb3rt1tan-lms
        run: |
          python -m venv .local/audit-venv
          .local/audit-venv/bin/python -m pip install --require-hashes -r tooling/security-requirements.lock
          .local/audit-venv/bin/python scripts/validate-sbom.py
          python scripts/audit-dependencies.py --auditor-python .local/audit-venv/bin/python
      - name: Verify production CSP excludes development endpoints
        working-directory: cyb3rt1tan-lms/web
        run: npm run verify:security-config
      - name: Web verification
        working-directory: cyb3rt1tan-lms/web
        run: |
          npm run test
          npm run typecheck
          npm run build
      - name: Preserve foundation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: master-kit-foundation-evidence
          path: cyb3rt1tan-lms/docs/master-kit/*.json
